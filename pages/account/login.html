<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Krishna Clothing Store</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/header.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/checkout.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <div id="announcement-bar-container"></div>
  <div id="site-header-container"></div>

  <main>
    <section class="container" style="padding: 60px 0 80px 0;">
      <div class="checkout-form-box" style="max-width: 480px; margin: 0 auto;">
        <h2 class="font-heading" style="color: var(--primary-main); text-align: center; margin-bottom: 24px;">Customer Sign In</h2>

        <form onsubmit="window.handleLogin(event)">
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="login-email" required placeholder="radhika@example.com">
          </div>

          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 16px;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
          New to Krishna Clothing? <a href="/pages/account/register.html" style="color: var(--gold-dark); font-weight: 700;">Create Account</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-container"></div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
