<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Krishna Clothing Store</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/header.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/checkout.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <div id="announcement-bar-container"></div>
  <div id="site-header-container"></div>

  <main>
    <section class="container checkout-section">
      <h1 class="font-heading" style="color: var(--primary-main); text-align: center; margin-bottom: 24px; font-size: 1.4rem; font-weight: 800;">Secure Checkout</h1>

      <div class="checkout-grid">
        <!-- Address & Payment Form -->
        <div class="checkout-form-box">
          <form onsubmit="window.placeOrder(event)">
            <div class="checkout-section-title">
              <span>1. Shipping Details</span>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="chk-name" required placeholder="e.g. Radhika Sharma">
              </div>
              <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="chk-phone" required placeholder="+91 98765 43210">
              </div>
            </div>

            <div class="form-group">
              <label>Email Address *</label>
              <input type="email" id="chk-email" required placeholder="radhika@example.com">
            </div>

            <div class="form-group">
              <label>Complete Delivery Address *</label>
              <textarea id="chk-address" rows="3" required placeholder="House/Flat No., Building Name, Street..."></textarea>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label>City / Town *</label>
                <input type="text" id="chk-city" required placeholder="Noida / Vrindavan">
              </div>
              <div class="form-group">
                <label>Pincode *</label>
                <input type="text" id="chk-pincode" required placeholder="201301">
              </div>
            </div>

            <div class="checkout-section-title" style="margin-top: 32px;">
              <span>2. Payment Option</span>
            </div>

            <div class="payment-methods-grid">
              <div class="payment-card-option selected" onclick="window.selectPaymentOption('upi', this)">
                <input type="radio" name="payment" checked>
                <span class="payment-icon">📱</span>
                <div>
                  <strong style="font-size: 0.85rem;">UPI Payment (Google Pay / PhonePe / Paytm)</strong>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">Instant zero-fee payment</div>
                </div>
              </div>

              <div class="payment-card-option" onclick="window.selectPaymentOption('card', this)">
                <input type="radio" name="payment">
                <span class="payment-icon">💳</span>
                <div>
                  <strong style="font-size: 0.85rem;">Credit / Debit Card</strong>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">Visa, Mastercard, RuPay</div>
                </div>
              </div>

              <div class="payment-card-option" onclick="window.selectPaymentOption('cod', this)">
                <input type="radio" name="payment">
                <span class="payment-icon">📦</span>
                <div>
                  <strong style="font-size: 0.85rem;">Cash on Delivery (COD)</strong>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">Pay upon delivery at your doorstep</div>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 24px; padding: 12px 20px; font-size: 0.9rem; font-weight: 700;">
              Place Divine Order Now
            </button>
          </form>
        </div>

        <!-- Order Summary Side Card -->
        <div class="order-summary-box">
          <h3 class="summary-title">Order Items</h3>
          <div id="checkout-items-list">
            <!-- Rendered by checkout.js -->
          </div>
          <div style="display: flex; justify-content: space-between; border-top: 2px solid var(--gold-primary); padding-top: 12px; margin-top: 14px; font-weight: 800; font-size: 0.95rem; color: var(--primary-main);">
            <span>Total Payable:</span>
            <span id="checkout-total-val" style="color: var(--gold-dark);">₹0</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-container"></div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/checkout.js"></script>
</body>
</html>
