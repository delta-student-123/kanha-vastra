<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coupons & Discounts | Admin Portal</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--primary-dark); color: #fff; padding: 24px; border-right: 2px solid var(--gold-primary); }
    .admin-sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px; color: #9ca3af; border-radius: var(--radius-sm); margin-bottom: 4px; font-weight: 600; }
    .admin-sidebar a:hover, .admin-sidebar a.active { background: var(--gold-gradient); color: var(--primary-dark); }
    .admin-main { background: #f4f6f9; padding: 32px; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div style="margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <img src="/assets/images/logo.png" alt="Kanha Vastra Logo" style="height: 42px; width: 100%; background: #ffffff; padding: 4px 8px; border-radius: 6px; object-fit: contain;">
      </div>
      <nav>
        <a href="/admin/index.html">📊 Dashboard</a>
        <a href="/admin/products.html">📦 Products</a>
        <a href="/admin/add-product.html">➕ Add Product</a>
        <a href="/admin/orders.html">🛒 Orders</a>
        <a href="/admin/customers.html">👥 Customers</a>
        <a href="/admin/inventory.html">📉 Inventory Stock</a>
        <a href="/admin/coupons.html" class="active">🏷️ Coupons</a>
        <a href="/admin/reviews.html">⭐ Reviews</a>
      </nav>
    </aside>
    <main class="admin-main">
      <h1 class="font-heading" style="color: var(--primary-main); margin-bottom: 24px;">Discounts & Promo Coupons</h1>
      <div style="background: #fff; padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border-light);">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
          <thead>
            <tr style="border-bottom: 2px solid var(--border-light); text-align: left; color: var(--primary-main);">
              <th style="padding: 10px;">Coupon Code</th>
              <th style="padding: 10px;">Discount Rate</th>
              <th style="padding: 10px;">Applicability</th>
              <th style="padding: 10px;">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom: 1px solid var(--border-light);">
              <td style="padding: 12px; font-weight: 700; color: var(--gold-dark);">JANMASTHAMI20</td>
              <td style="padding: 12px; font-weight: 700;">20% OFF</td>
              <td style="padding: 12px;">All Laddu Gopal Poshaks & Crowns</td>
              <td style="padding: 12px;"><span class="badge badge-green">ACTIVE</span></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--border-light);">
              <td style="padding: 12px; font-weight: 700; color: var(--gold-dark);">KRISHNA10</td>
              <td style="padding: 12px; font-weight: 700;">10% OFF</td>
              <td style="padding: 12px;">First Order Welcome Discount</td>
              <td style="padding: 12px;"><span class="badge badge-green">ACTIVE</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
