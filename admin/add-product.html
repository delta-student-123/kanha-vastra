<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | Admin Portal</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/checkout.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <style>
    .admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--primary-dark); color: #fff; padding: 24px; border-right: 2px solid var(--gold-primary); }
    .admin-sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px; color: #9ca3af; border-radius: var(--radius-sm); margin-bottom: 4px; font-weight: 600; }
    .admin-sidebar a:hover, .admin-sidebar a.active { background: var(--gold-gradient); color: var(--primary-dark); }
    .admin-main { background: #f4f6f9; padding: 32px; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div style="margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <img src="/assets/images/logo.png" alt="Kanha Vastra Logo" style="height: 42px; width: 100%; background: #ffffff; padding: 4px 8px; border-radius: 6px; object-fit: contain;">
      </div>
      <nav>
        <a href="/admin/index.html">📊 Dashboard</a>
        <a href="/admin/products.html">📦 Products</a>
        <a href="/admin/add-product.html" class="active">➕ Add Product</a>
        <a href="/admin/orders.html">🛒 Orders</a>
        <a href="/admin/customers.html">👥 Customers</a>
        <a href="/admin/inventory.html">📉 Inventory Stock</a>
        <a href="/admin/coupons.html">🏷️ Coupons</a>
        <a href="/admin/reviews.html">⭐ Reviews</a>
        <a href="/index.html" style="margin-top: 40px; color: var(--crimson-accent);">🌐 Back to Storefront</a>
      </nav>
    </aside>

    <main class="admin-main">
      <h1 class="font-heading" style="color: var(--primary-main); margin-bottom: 28px;">Add New Poshak / Accessory</h1>

      <div class="checkout-form-box" style="max-width: 700px;">
        <form onsubmit="event.preventDefault(); window.showToast('New product added to inventory!'); setTimeout(() => window.location.href='/admin/products.html', 1000);">
          <div class="form-group">
            <label>Product Title *</label>
            <input type="text" required placeholder="e.g., Royal Zardozi Silk Poshak">
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>Category *</label>
              <select required>
                <option value="laddu-gopal">Laddu Gopal Dresses</option>
                <option value="ethnic-wear">Krishna Ethnic Wear</option>
                <option value="mukut">Mukut & Crowns</option>
                <option value="jewellery">Shringar & Jewellery</option>
                <option value="accessories">Devotional Accessories</option>
              </select>
            </div>
            <div class="form-group">
              <label>Selling Price (₹) *</label>
              <input type="number" required placeholder="1499">
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label>Original Price (₹)</label>
              <input type="number" placeholder="1999">
            </div>
            <div class="form-group">
              <label>Stock Quantity *</label>
              <input type="number" required placeholder="50">
            </div>
          </div>

          <div class="form-group">
            <label>Product Image URL *</label>
            <input type="url" required placeholder="https://images.unsplash.com/...">
          </div>

          <div class="form-group">
            <label>Description *</label>
            <textarea rows="4" required placeholder="Describe fabric, embroidery details, and size availability..."></textarea>
          </div>

          <button type="submit" class="btn btn-gold btn-lg" style="width: 100%; margin-top: 16px;">Publish Product to Store</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/assets/js/main.js"></script>
</body>
</html>
